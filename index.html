<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hitest - Hits zum Testen</title>
    <link rel="stylesheet" href="style.css">
    <script src="scanner.js" defer></script>
    <script src="video.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script> <!-- Library QR-Code-Scanner -->
</head>
<body>
<header>
    <h1>Hitest - Hits zum Testen</h1>
    <button onclick="startScanner()">Start</button>
</header>
<nav>
    <a href="link.html">QR Code erstellen</a>
    <!--<a href="../scanner.html">QR Code scannen</a>
    <a href="../sdf.html">Link einfügen</a>-->
</nav>

<main>
    <!--<p>Bisschen Text</p>-->
    <video id="qr-video" style="display:none;"></video>

    <!-- Hier wird der erkannte Link angezeigt -->
    <p id="qr-result">Warten auf QR-Code...</p>

    <button id="start-scanner">Scanner starten</button>
    <button id="stop-scanner" style="display:none;">Scanner stoppen</button>

    <br> <br>

    <input type="text" id="youtube-url" placeholder="YouTube Video URL" style="width: 400px;">
    <button onclick="embedVideo()">Video einbinden</button>
    <button onclick="clearSearchfield()">Clear</button>

    <div id="video-container"></div>

    <div id="controls" style="display: none;">
        <button onclick="playVideo()">Play</button>
        <button onclick="pauseVideo()">Pause</button>
        <button onclick="seekForward()">+10s</button>
        <button onclick="seekBackward()">-10s</button>
    </div>

</main>
